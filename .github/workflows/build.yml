name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/browsers
      JUPYTER_CONFIG_DIR: ${{ github.workspace }}/work/jupyter-config
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.59.0
          cache: true
      - name: Install JavaScript dependencies
        run: pixi run --as-is jlpm install --immutable
      - name: Restore compiler assets
        id: compiler
        uses: actions/cache@v4
        with:
          path: compiler
          key: >-
            compiler-linux-${{ hashFiles(
            'runtime/src/**', 'runtime/CMakeLists.txt', 'runtime/locks/**',
            'runtime/sources.json', 'runtime/licenses/**',
            'scripts/compiler.mjs') }}
      - name: Reproduce compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        run: pixi run --as-is jlpm build:compiler
      - name: Check source and unit tests
        run: |
          pixi run --as-is jlpm lint:check
          pixi run --as-is jlpm typecheck
          pixi run --as-is jlpm test
      - name: Build all hosts
        run: |
          pixi run --as-is jlpm build:prod
          pixi run --as-is python -m pip install \
            --no-build-isolation --no-deps -e .
          pixi run --as-is jupyter-builder develop . --overwrite
          pixi run --as-is jlpm build:standalone
          pixi run --as-is node scripts/lite.mjs
      - name: Build and verify distributions
        run: |
          pixi run --as-is jlpm pack --out dist/fortitudo.tgz
          pixi run --as-is python -m build --no-isolation
          pixi run --as-is jlpm test:packages
      - name: Install browsers
        run: pixi run --as-is jlpm playwright install --with-deps
      - name: Test real browser workflows
        run: pixi run --as-is jlpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/fortitudo*
            dist/standalone
            lite/_output
            compiler/manifest.json
          if-no-files-found: error

  wheel:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
      - name: Verify installation without a frontend build
        run: |
          python -m pip install 'jupyterlab>=4.6,<5' dist/fortitudo*.whl
          jupyter labextension list
          python -m jupyterlab.browser_check --no-browser-test
