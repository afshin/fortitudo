name: Publish Release

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Registry to publish to; none only builds and validates
        required: true
        default: none
        type: choice
        options:
          - none
          - pypi
          - npm
          - both

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require the existing stable release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open('package.json') as file:
              package = json.load(file)
          version = package['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          assert package['name'] == 'fortitudo'
          assert os.environ['RELEASE_REF'] == f'refs/tags/v{version}', (
              f'Run this workflow from the existing v{version} tag.'
          )
          PY

  build:
    needs: release
    uses: ./.github/workflows/build.yml
    with:
      release: true

  pypi:
    needs: build
    if: inputs.destination == 'pypi' || inputs.destination == 'both'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/fortitudo/
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI with trusted publishing
        # pypa/gh-action-pypi-publish@release/v1
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/

  npm:
    needs: build
    if: inputs.destination == 'npm' || inputs.destination == 'both'
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/fortitudo
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-distribution
          path: dist
      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
      - name: Publish to npm with trusted publishing
        run: |
          npm --version
          npm publish dist/fortitudo.tgz --access public --tag latest \
            --ignore-scripts --registry https://registry.npmjs.org
